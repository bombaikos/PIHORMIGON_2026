<title>Prontuario Informático del Hormigón 2026 BETA a</title>
<style>
/* Prontuario web. Estilo según analisis/guia-estilo-prontuario.md (la maqueta de flexión es la referencia).
   Disposición: todo en una pantalla de PC (§ 13): barra de una línea; datos | dibujo | resultados, sin scroll de página. En móvil, una columna. */
:root {
  --suelo: oklch(96.4% 0.005 240);
  --hoja: oklch(99.6% 0.002 240);
  --hundido: oklch(95.2% 0.006 240);
  --campo: oklch(100% 0 0); --campo-borde: oklch(78% 0.05 252);
  --nota: oklch(94.8% 0.014 78); --nota-borde: oklch(85.5% 0.024 75);
  --tinta: oklch(24% 0.02 248);
  --tinta-2: oklch(44% 0.02 248);
  --tinta-3: oklch(57% 0.016 248);
  --linea: oklch(90% 0.008 240);
  --linea-fuerte: oklch(80% 0.012 240);
  --acento: oklch(47% 0.13 252);
  --serie-m: oklch(47% 0.13 252); --serie-v: oklch(52% 0.11 125); --serie-giro: oklch(52% 0.09 195); --serie-flecha: oklch(50% 0.10 55);
  --acento-suave: oklch(93.5% 0.03 252);
  /* Materiales del dibujo: un solo azul para la compresión; el rojo queda solo para lo que está mal */
  --hormigon: oklch(90% 0.006 85);
  --hormigon-borde: oklch(60% 0.01 85);
  --compr: oklch(62% 0.09 252);
  --traccion: oklch(66% 0.008 250);
  --acero: oklch(30% 0.012 250);
  --ok: oklch(46% 0.11 152);
  --ok-fondo: oklch(95% 0.035 152);
  --no: oklch(50% 0.17 27);
  --no-fondo: oklch(95.5% 0.03 27);
  --atencion: oklch(50% 0.1 70);
  --atencion-fondo: oklch(96% 0.04 85);
  --sombra: 0 1px 2px oklch(30% 0.02 250 / .06), 0 4px 16px oklch(30% 0.02 250 / .05);

  /* Solo fuentes del sistema: Segoe UI Variable en Windows 11, SF Pro en Mac, Roboto en Android */
  --f: system-ui, 'Segoe UI Variable Text', 'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;

  /* Serie tipográfica 10 · 12 · 14; solo el resultado principal va grande (28) */
  --mas: 2px; /* +2 px de texto y de alto de controles (Pepiño, 19/10); en todas las pantallas (28/10) */
  --t-xs: calc(10px + var(--mas)); --t-s: calc(12px + var(--mas)); --t-m: calc(14px + var(--mas)); --t-l: calc(14px + var(--mas)); --t-xl: calc(14px + var(--mas)); --t-xxl: 28px;
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px;
  --r-panel: 10px; --r-campo: 6px; --r-chip: 4px;
  --alto-campo: calc(24px + var(--mas));
  --hueco-campos: 4px;
}
/* Pantallas bajas (1366×657): mismo texto, menos aire vertical */
@media (max-height: 700px) { :root { --alto-campo: 24px; --hueco-campos: 2px; } body { line-height: 1.3; } }
:root[data-densidad="comoda"] { --alto-campo: 32px; --hueco-campos: 10px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --suelo: oklch(17% 0.012 245); --hoja: oklch(21% 0.014 245); --hundido: oklch(18.5% 0.012 245); --campo: oklch(15.5% 0.02 250); --campo-borde: oklch(46% 0.06 252); --nota: oklch(25.5% 0.014 72); --nota-borde: oklch(36% 0.022 70);
    --tinta: oklch(93% 0.008 240); --tinta-2: oklch(78% 0.012 240); --tinta-3: oklch(66% 0.014 240);
    --linea: oklch(29% 0.014 245); --linea-fuerte: oklch(38% 0.016 245);
    --acento: oklch(74% 0.11 250); --acento-suave: oklch(30% 0.05 252);
  --serie-m: oklch(74% 0.11 250); --serie-v: oklch(76% 0.11 125); --serie-giro: oklch(76% 0.09 195); --serie-flecha: oklch(76% 0.10 60);
    --hormigon: oklch(33% 0.008 85); --hormigon-borde: oklch(58% 0.01 85);
    --compr: oklch(62% 0.1 252); --traccion: oklch(55% 0.01 250); --acero: oklch(88% 0.008 250);
    --ok: oklch(76% 0.13 152); --ok-fondo: oklch(29% 0.05 152);
    --no: oklch(74% 0.14 27); --no-fondo: oklch(30% 0.06 27);
    --atencion: oklch(80% 0.11 80); --atencion-fondo: oklch(30% 0.05 80);
    --sombra: 0 1px 2px oklch(0% 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --suelo: oklch(17% 0.012 245); --hoja: oklch(21% 0.014 245); --hundido: oklch(18.5% 0.012 245); --campo: oklch(15.5% 0.02 250); --campo-borde: oklch(46% 0.06 252); --nota: oklch(25.5% 0.014 72); --nota-borde: oklch(36% 0.022 70);
  --tinta: oklch(93% 0.008 240); --tinta-2: oklch(78% 0.012 240); --tinta-3: oklch(66% 0.014 240);
  --linea: oklch(29% 0.014 245); --linea-fuerte: oklch(38% 0.016 245);
  --acento: oklch(74% 0.11 250); --acento-suave: oklch(30% 0.05 252);
  --serie-m: oklch(74% 0.11 250); --serie-v: oklch(76% 0.11 125); --serie-giro: oklch(76% 0.09 195); --serie-flecha: oklch(76% 0.10 60);
  --hormigon: oklch(33% 0.008 85); --hormigon-borde: oklch(58% 0.01 85);
  --compr: oklch(62% 0.1 252); --traccion: oklch(55% 0.01 250); --acero: oklch(88% 0.008 250);
  --ok: oklch(76% 0.13 152); --ok-fondo: oklch(29% 0.05 152);
  --no: oklch(74% 0.14 27); --no-fondo: oklch(30% 0.06 27);
  --atencion: oklch(80% 0.11 80); --atencion-fondo: oklch(30% 0.05 80);
  --sombra: 0 1px 2px oklch(0% 0 0 / .3);
  color-scheme: dark;
}
@media (prefers-contrast: more) {
  :root { --linea: var(--linea-fuerte); --tinta-3: var(--tinta-2); }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--suelo); color: var(--tinta); font: var(--t-s)/1.4 var(--f); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
sub { font-size: .72em; line-height: 0; }

/* ---------- barra de proyecto ---------- */
.barra {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--e2) var(--e5);
  padding: var(--e2) var(--e4); background: var(--hoja); border-bottom: 1px solid var(--linea);
}
.marca { display: flex; align-items: center; gap: var(--e3); min-width: 0; }
.marca svg { flex: none; }
.marca .txt { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.marca .app { font-size: var(--t-xs); color: var(--tinta-3); letter-spacing: .02em; }
.marca .proy { font-size: var(--t-l); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.menu { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.menu button {
  background: none; border: 0; padding: 6px 10px; border-radius: var(--r-campo); cursor: pointer;
  color: var(--tinta-2); white-space: nowrap; min-height: 32px;
}
.menu button:hover { background: var(--hundido); color: var(--tinta); }
.menu button[aria-current="page"] { color: var(--acento); background: var(--acento-suave); font-weight: 600; }
.menu button[aria-disabled="true"] { color: var(--tinta-3); }
.lado { margin-left: auto; display: flex; align-items: center; gap: var(--e2); flex-wrap: wrap; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border-radius: 8px; background: var(--hundido); border: 1px solid var(--linea); }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: var(--r-campo); cursor: pointer; color: var(--tinta-2); min-height: 26px; font-size: var(--t-s); white-space: nowrap; }
.seg button[aria-checked="true"] { background: var(--hoja); color: var(--tinta); font-weight: 600; box-shadow: var(--sombra); }
.seg.ancho { display: flex; }
.seg.ancho button { flex: 1; }
.tecla { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linea); background: var(--hoja); border-radius: var(--r-campo); padding: 3px 8px; color: var(--tinta-3); cursor: pointer; font-size: var(--t-s); min-height: 28px; }
kbd { font: calc(11px + var(--mas)) var(--f); border: 1px solid var(--linea-fuerte); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; color: var(--tinta-2); background: var(--hoja); }

/* ---------- área de trabajo ---------- */
.trabajo {
  display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); gap: var(--e4);
  padding-block: var(--e4) var(--e6); padding-inline: var(--e4); max-width: 1480px; margin: 0 auto; align-items: start;
}
@media (max-width: 860px) { .trabajo { grid-template-columns: minmax(0, 1fr); } }

.panel { background: var(--hoja); border: 1px solid var(--linea); border-radius: var(--r-panel); min-width: 0; }
.datos { padding: var(--e4); display: flex; flex-direction: column; gap: var(--e3); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
@media (max-width: 860px) { .datos { position: static; } }
.cab { display: flex; flex-direction: column; gap: 2px; }
.cab h1 { font-size: var(--t-xl); line-height: 1.25; margin: 0; font-weight: 650; text-wrap: balance; }
.cab p { margin: 0; color: var(--tinta-3); font-size: var(--t-s); }
.grupo { display: flex; flex-direction: column; gap: var(--hueco-campos); border: 0; margin: 0; padding: var(--e3) 0 0; border-top: 1px solid var(--linea); min-width: 0; }
.grupo legend { float: left; width: 100%; padding: 0; font-size: calc(11px + var(--mas)); font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); }
.par { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--hueco-campos) var(--e3); }

.campo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.campo > label { font-size: var(--t-s); color: var(--tinta-2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.campo > label .ref { color: var(--tinta-3); font-size: var(--t-xs); float: right; margin-top: 1px; }
.caja {
  display: flex; align-items: center; height: var(--alto-campo); background: var(--campo);
  border: 1px solid var(--campo-borde); border-radius: var(--r-campo); transition: border-color .12s, background-color .12s;
}
.caja:hover { border-color: var(--acento); }
.caja:focus-within { border-color: var(--acento); background: var(--campo); box-shadow: 0 0 0 3px var(--acento-suave); }
.caja input { font-size: var(--t-m); }
.caja input, .caja select { flex: 1; min-width: 0; height: 100%; border: 0; background: none; padding: 0 9px; outline: none; }
.caja input { text-align: right; }
.caja input.texto { text-align: left; }
.caja input.armado { text-align: right; } /* el armado es una cantidad: a la derecha, como los números */
.caja .ud { padding-right: 9px; color: var(--tinta-3); font-size: calc(11px + var(--mas)); white-space: nowrap; }
.caja select { cursor: pointer; padding: 0 0 0 6px; }
.campo.mal .caja { border-color: var(--no); background: var(--no-fondo); }
.campo .eco { font-size: var(--t-xs); color: var(--tinta-3); }
.campo .eco:empty { display: none; }
.campo.mal .eco { color: var(--no); }
.pista { font-size: var(--t-xs); color: var(--tinta-3); margin: 0; line-height: 1.6; }
.pista code { font: inherit; font-weight: 600; color: var(--tinta-2); }
.calculada { font-size: var(--t-s); color: var(--tinta-2); background: var(--hundido); border-radius: var(--r-campo); padding: var(--e2) var(--e3); margin: 0; }

/* En densidad compacta la etiqueta va a la izquierda del valor, como en un panel de propiedades */
:root:not([data-densidad="comoda"]) .campo { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
:root:not([data-densidad="comoda"]) .campo > label { flex: 0 1 auto; max-width: 50%; }
:root:not([data-densidad="comoda"]) .campo > label .ref { display: none; }
:root:not([data-densidad="comoda"]) .campo .caja { flex: 1 1 0; min-width: 0; }
:root:not([data-densidad="comoda"]) .campo .eco { flex-basis: 100%; text-align: right; }
:root:not([data-densidad="comoda"]) .pista { display: none; }

/* ---------- resultados ---------- */
.resultados { display: flex; flex-direction: column; gap: var(--e4); min-width: 0; }
.veredicto {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 3;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--e3) var(--e5);
  padding: var(--e3) var(--e4); border-radius: var(--r-panel); border: 1px solid var(--linea); background: var(--hoja); box-shadow: var(--sombra);
  transition: border-color .2s;
}
@media (max-width: 860px) { .veredicto { position: static; } }
.veredicto.cumple { border-color: color-mix(in oklch, var(--ok) 40%, var(--linea)); }
.veredicto.nocumple { border-color: color-mix(in oklch, var(--no) 50%, var(--linea)); }
.veredicto.atencion { border-color: color-mix(in oklch, var(--atencion) 45%, var(--linea)); }
.ratio { display: flex; flex-direction: column; line-height: 1.1; }
.ratio .etq { font-size: var(--t-xs); color: var(--tinta-3); }
.ratio .v { font-size: var(--t-xxl); font-weight: 650; letter-spacing: -.01em; white-space: nowrap; }
.ratio .v .u { font-size: .5em; }
.medidor { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.medidor .ecu { font-size: var(--t-s); color: var(--tinta-2); }
.medidor .ecu b { color: var(--tinta); font-weight: 600; }
.pista-barra { position: relative; height: 8px; border-radius: 4px; background: var(--hundido); border: 1px solid var(--linea); overflow: hidden; }
.pista-barra i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; background: var(--ok); transition: width .2s ease-out, background-color .2s; }
.pista-barra .uno { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--tinta-2); left: calc(100% / 1.25); }
.veredicto.nocumple .pista-barra i { background: var(--no); }
.veredicto.sin-barra .pista-barra { display: none; }
.sello { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; font-weight: 650; font-size: var(--t-m); white-space: nowrap; }
.cumple .sello { background: var(--ok-fondo); color: var(--ok); }
.nocumple .sello { background: var(--no-fondo); color: var(--no); }
.atencion .sello { background: var(--atencion-fondo); color: var(--atencion); }
.veredicto.viejo { opacity: .55; }
.rotura { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
.rotura .etq { font-size: var(--t-s); color: var(--tinta-3); }
.rotura .sello { padding: 3px 10px; }
.rotura .pista { margin: 0 0 0 auto; font-size: var(--t-s); color: var(--tinta-2); }
.grafica-flex { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
@media (max-width: 520px) { .veredicto { grid-template-columns: auto auto; } .medidor { grid-column: 1 / -1; order: 3; } .sello { justify-self: end; } }

.cuerpo { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--e4); }
@media (min-width: 1240px) { .cuerpo { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); } }
.tarjeta { padding: var(--e4); display: flex; flex-direction: column; gap: var(--e3); container-type: inline-size; }
.tarjeta h2 { font-size: var(--t-l); margin: 0; font-weight: 650; }
.tarjeta .sub { margin: -6px 0 0; color: var(--tinta-3); font-size: var(--t-s); }
.tarjeta h3 { font-size: var(--t-m); margin: var(--e2) 0 0; font-weight: 650; }

.cifras { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--linea); border: 1px solid var(--linea); border-radius: var(--r-campo); overflow: hidden; }

.cifra { background: var(--hoja); padding: 4px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.cifra .etq { font-size: var(--t-s); color: var(--tinta-3); }
.cifra .v { font-size: var(--t-m); font-weight: 600; line-height: 1.3; white-space: nowrap; }
.u { font-weight: 400; color: var(--tinta-3); font-size: .7em; }
.u.u-cab { font-size: 1em; white-space: nowrap; } /* unidad en la cabecera de fila o columna (guía § 13) */

/* traza: cada resultado se despliega para ver de dónde sale */
.traza { display: flex; flex-direction: column; border-top: 1px solid var(--linea); }
.traza details { border-bottom: 1px solid var(--linea); }
.traza summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: var(--e2); align-items: baseline;
  padding: 3px 4px; border-radius: var(--r-chip);
}
.traza summary::-webkit-details-marker { display: none; }
.traza summary::before { content: ''; width: 6px; height: 6px; border-right: 1.5px solid var(--tinta-3); border-bottom: 1.5px solid var(--tinta-3); transform: rotate(-45deg); align-self: center; transition: transform .15s; margin-left: 2px; }
.traza details[open] summary::before { transform: rotate(45deg); }
.traza summary:hover, .traza details.foco summary { background: var(--hundido); }
.traza .nom { color: var(--tinta-2); min-width: 0; }
.traza .val { font-weight: 600; text-align: right; white-space: nowrap; }
/* Fila de resultado que se despliega: la flecha delante del nombre, la cuenta en la fila de debajo */
tr.plegable { cursor: pointer; }
tr.plegable:hover th, tr.plegable:hover td, tr.plegable:focus-visible th, tr.plegable:focus-visible td { background: var(--suelo); }
tr.plegable:focus-visible { outline: none; }
table:has(tr.plegable) tbody tr:not(.cuenta-fila) > :first-child { position: relative; padding-left: 16px; } /* todas las filas con la misma sangría */
tr.plegable > :first-child::before { content: ''; position: absolute; left: 4px; top: calc(50% - 4px); width: 5px; height: 5px; border-right: 1.5px solid var(--tinta-3); border-bottom: 1.5px solid var(--tinta-3); transform: rotate(-45deg); transition: transform .15s; }
tr.plegable[aria-expanded="true"] > :first-child::before { transform: rotate(45deg); }
tr.cuenta-fila > td { padding: 0; text-align: left; }
/* abierta: la fila y su explicación forman una sola caja */
tr.plegable[aria-expanded="true"] > th, tr.plegable[aria-expanded="true"] > td, tr.plegable[aria-expanded="true"] + tr.cuenta-fila > td { background: var(--nota); }
tr.plegable[aria-expanded="true"] > * { border-top: 1px solid var(--nota-borde); border-bottom: 0; }
tr.plegable[aria-expanded="true"] > :first-child, tr.plegable[aria-expanded="true"] + tr.cuenta-fila > td { border-left: 1px solid var(--nota-borde); }
tr.plegable[aria-expanded="true"] > :last-child, tr.plegable[aria-expanded="true"] + tr.cuenta-fila > td { border-right: 1px solid var(--nota-borde); }
tr.plegable[aria-expanded="true"] + tr.cuenta-fila > td { border-bottom: 1px solid var(--nota-borde); border-top: 0; }
tr.plegable[aria-expanded="true"]:hover > th, tr.plegable[aria-expanded="true"]:hover > td { background: var(--nota); }
tr.cuenta-fila .cuenta { padding: var(--e2) var(--e3); color: var(--tinta-2); font-size: var(--t-s); display: flex; flex-direction: column; gap: 4px; white-space: normal; }
.traza .cuenta { margin: 0 0 var(--e3) 22px; padding: var(--e2) var(--e3); background: var(--nota); border: 1px solid var(--nota-borde); border-radius: 6px; color: var(--tinta-2); font-size: var(--t-s); display: flex; flex-direction: column; gap: 4px; }
.cuenta .f { color: var(--tinta); }
.cuenta .n { color: var(--tinta-2); }
.cuenta .art { display: inline-flex; align-self: flex-start; gap: 6px; margin-top: 2px; font-size: var(--t-xs); color: var(--tinta-3); border: 1px solid var(--nota-borde); border-radius: var(--r-chip); padding: 0 6px; }

.avisos { display: flex; flex-direction: column; gap: var(--e2); }
.aviso { margin: 0; padding: var(--e2) var(--e3); border-radius: var(--r-campo); font-size: var(--t-s); background: var(--atencion-fondo); color: var(--atencion); }
.aviso.error { background: var(--no-fondo); color: var(--no); }
.aviso.info { background: var(--acento-suave); color: var(--tinta-2); }

/* ---------- dibujo ---------- */
.lienzo { overflow-x: auto; }
svg.dib { width: 100%; height: auto; display: block; min-width: 460px; }
.nota-plegada[open] { background: var(--nota); border: 1px solid var(--nota-borde); border-radius: 6px; padding: 4px 8px; color: var(--tinta-2); }
.nota-plegada summary { cursor: pointer; color: var(--tinta-3); font-size: var(--t-s); list-style-position: inside; }
.nota-plegada[open] summary { margin-bottom: 4px; }
.dib text { fill: var(--tinta-2); font: calc((12px + var(--mas)) / var(--k, 1)) var(--f); font-variant-numeric: tabular-nums; }

.dib .en { stroke: var(--acento); stroke-width: 1.2; stroke-dasharray: 6 4; }
.dib .cota { stroke: var(--tinta-3); stroke-width: .8; fill: none; }
.dib .ref { stroke: var(--linea-fuerte); stroke-width: .8; }
.dib .eps-c { fill: color-mix(in oklch, var(--compr) 35%, transparent); stroke: var(--compr); stroke-width: 1.2; }
.dib .eps-t { fill: url(#rayado-t); stroke: var(--traccion); stroke-width: 1.2; }
.dib .sig-c { fill: color-mix(in oklch, var(--compr) 35%, transparent); stroke: var(--compr); stroke-width: 1.4; }
.dib .flecha { stroke: var(--acero); stroke-width: 2; fill: none; }
.dib .punta { fill: var(--acero); }
.leyenda { display: flex; flex-wrap: wrap; gap: var(--e2) var(--e4); font-size: var(--t-xs); color: var(--tinta-3); }
.leyenda span { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- propuesta ---------- */
.tabla-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--t-s); }
th, td { padding: 1px 6px; border-bottom: 1px solid var(--linea); text-align: right; white-space: nowrap; }

tbody tr:hover { background: var(--hundido); }

/* ---------- paleta de comandos ---------- */
dialog.paleta { border: 1px solid var(--linea); border-radius: 12px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--hoja); color: var(--tinta); box-shadow: 0 24px 64px oklch(20% 0.02 250 / .25); margin-top: 12vh; }

.aviso-flot { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: var(--tinta); color: var(--hoja); padding: 8px 14px; border-radius: 8px; font-size: var(--t-s); z-index: 10; box-shadow: var(--sombra); max-width: calc(100vw - 32px); }

.pie { max-width: 1480px; margin: 0 auto; padding-inline: var(--e4); padding-block: 0 var(--e5); color: var(--tinta-3); font-size: var(--t-xs); }


/* ---------- una sola pantalla en PC ---------- */
@media (min-width: 1100px) and (min-height: 600px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .barra { position: static; padding: 4px 12px; gap: 4px 16px; flex: none; }
  .marca svg { width: 22px; height: 22px; }
  .marca .proy { font-size: var(--t-m); }
  .menu button { min-height: 28px; padding: 3px 9px; }
  .trabajo {
    flex: 1; min-height: 0; width: 100%; max-width: none;
    grid-template-columns: 324px minmax(0, 1.25fr) minmax(320px, 1fr); grid-template-rows: auto auto minmax(0, 1fr);
    gap: 8px; padding: 8px 12px; align-items: stretch;
  }
  .resultados, .cuerpo { display: contents; }
  .datos { grid-column: 1; grid-row: 1 / -1; position: static; overflow: auto; padding: 10px 12px; gap: 8px; }
  .veredicto { grid-column: 2 / -1; grid-row: 1; position: static; padding: 6px 12px; }
  .avisos { grid-column: 2 / -1; grid-row: 2; }
  .avisos:empty { display: block; }
  .cuerpo > .tarjeta:first-child { grid-column: 2; grid-row: 3; }
  .cuerpo > .tarjeta:last-child { grid-column: 3; grid-row: 3; overflow: auto; }
  .tarjeta { padding: 10px 12px; gap: 6px; min-height: 0; }
  .tarjeta .sub { display: none; }
  .lienzo { flex: 1; min-height: 0; overflow: hidden; }
  svg.dib { height: 100%; min-width: 0; }
  .aviso { padding: 3px 8px; }
}
/* Pantallas bajas (1366×657): mismo texto 12/14/16, menos aire entre bloques */
@media (min-width: 1100px) and (min-height: 600px) and (max-height: 700px) {
  .tarjeta { padding: 6px 12px; gap: 4px; }
  .tarjeta h3 { margin: 4px 0 0; }
  .datos { padding: 8px 12px; gap: 4px; }

  .trabajo { gap: 6px; padding: 6px 10px; }
  .cifra { padding: 2px 8px; }
  th, td { padding: 0 6px; }

}
@media (forced-colors: active) {
  .dib .hor { fill: Canvas; stroke: CanvasText; }

  .dib .eps-c, .dib .eps-t, .dib .sig-c { fill: none; stroke: CanvasText; }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print {
  .barra, .veredicto, .datos { position: static; box-shadow: none; }
  .menu, .lado, .pie, .pista { display: none; }
  body { background: #fff; }
}

/* ---------- añadidos de la aplicación ---------- */
/* ---------- añadidos de la app sobre la maqueta ---------- */
.chip-ejemplo { font-size: calc(11px + var(--mas)); font-weight: 500; padding: 1px 6px; border-radius: var(--r-chip); background: var(--atencion-fondo); color: var(--atencion); vertical-align: middle; }
.dib .tic { stroke: var(--tinta-3); stroke-width: 1.2; }
.dib .cota-capa.foco text, .dib .grp-ac.foco + .cota-capa text { fill: var(--acento); }

/* pestañas internas de una pantalla */

.pestanas button { border: 0; background: none; padding: 6px 8px; cursor: pointer; color: var(--tinta-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; min-height: 32px; }

/* listas de elementos del proyecto (secciones, materiales) */
.lista-sel { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.lista-sel button { display: flex; align-items: baseline; gap: var(--e2); width: 100%; text-align: left; background: none; border: 0; border-radius: var(--r-campo); padding: 5px 8px; cursor: pointer; color: var(--tinta); min-height: 28px; }

.lista-sel .dato { margin-left: auto; font-size: var(--t-xs); color: var(--tinta-3); font-weight: 400; }
.fila-botones { display: flex; flex-wrap: wrap; gap: var(--e2); }
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: var(--r-campo); padding: 5px 12px; min-height: 30px; cursor: pointer; font-size: var(--t-s); font-weight: 600; border: 1px solid var(--acento); background: var(--acento); color: var(--hoja); }
.boton.secundario { background: var(--hoja); color: var(--acento); }
.boton.secundario:hover { background: var(--acento-suave); }
.boton.discreto { border-color: var(--linea); background: none; color: var(--tinta-2); font-weight: 500; }
.boton.discreto:hover { background: var(--hundido); }
.boton.peligro { background: none; border-color: color-mix(in oklch, var(--no) 50%, var(--linea)); color: var(--no); font-weight: 500; }
.menu-mas { position: relative; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-sel { border: 1px solid var(--linea); background: var(--hoja); border-radius: var(--r-chip); padding: 2px 8px; min-height: 26px; cursor: pointer; color: var(--tinta-2); font-size: var(--t-s); }
.chip-sel[aria-pressed="true"] { background: var(--acento-suave); border-color: var(--acento); color: var(--acento); font-weight: 600; }
.etq-grupo { font-size: var(--t-s); color: var(--tinta-2); }
.nota { margin: 0; font-size: var(--t-s); color: var(--tinta-3); }
.nota code, .aviso code { font: inherit; font-weight: 600; }
details.json pre { font-size: calc(12px + var(--mas)); max-height: 360px; overflow: auto; background: var(--hundido); padding: var(--e3); border-radius: var(--r-campo); }
textarea.puntos { width: 100%; min-height: 120px; font: var(--t-s)/1.5 var(--f); font-variant-numeric: tabular-nums; border: 1px solid var(--linea); border-radius: var(--r-campo); background: var(--hundido); padding: 6px 9px; color: var(--tinta); resize: vertical; }
textarea.puntos:focus { outline: none; border-color: var(--acento); background: var(--hoja); box-shadow: 0 0 0 3px var(--acento-suave); }
.grupo-arm { display: flex; flex-direction: column; gap: var(--hueco-campos); padding: var(--e2); border: 1px solid var(--linea); border-radius: var(--r-campo); }
.grupo-arm .cab-arm { display: flex; justify-content: space-between; align-items: center; font-size: var(--t-s); font-weight: 600; color: var(--tinta-2); }
.grupo-arm .quitar { border: 0; background: none; color: var(--tinta-3); cursor: pointer; padding: 2px 6px; border-radius: var(--r-chip); }

table th[scope="row"] { font-weight: 400; color: var(--tinta-2); text-align: left; }
.tabla-2 td:first-child { text-align: left; }
.dib .diag { fill: color-mix(in oklch, var(--compr) 20%, transparent); stroke: var(--compr); stroke-width: 1.4; }
.dib .diag-t { fill: none; stroke: var(--acero); stroke-width: 1.4; }
.dib .eje { stroke: var(--linea-fuerte); stroke-width: 1; }
thead th { white-space: normal; vertical-align: bottom; }
/* El dibujo de flexión (sección + deformaciones + tensiones) necesita ancho: dos columnas solo en pantallas muy anchas */
.cuerpo.dib-ancho { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1560px) { .cuerpo.dib-ancho { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
/* Secciones: tipo en segmentado con el número de secciones de cada tipo; confirmación en línea */
.seg .n { font-size: 0.78em; color: var(--tinta-3, currentColor); opacity: .7; margin-left: .2em; font-variant-numeric: tabular-nums; }
.aviso.confirma { display: grid; gap: .4rem; }

.boton:disabled { opacity: .45; cursor: default; pointer-events: none; }
.seg.ancho { gap: 1px; }
.seg.ancho button { padding-inline: 3px; flex: 1 1 auto; }
/* Fila de armadura: texto ancho y distancia estrecha */
.fila-arm { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 10px; align-items: start; }
.pie-sec { border-top: 1px solid var(--linea); padding-top: 12px; margin-top: 4px; display: grid; gap: 6px; }
.pie-sec .fila-botones { margin: 0; }
/* Rejilla de datos (guía § 12) */
.rejilla-campo { gap: 2px; }
.marco-rejilla { overflow: auto; border: 1px solid var(--linea); border-radius: var(--r-campo); background: var(--hoja); }
.marco-rejilla.mal { border-color: color-mix(in oklch, var(--no) 50%, var(--linea)); }

table.rejilla th { position: sticky; top: 0; z-index: 1; background: var(--hundido); color: var(--tinta-2); font-weight: 600; text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--linea); white-space: nowrap; }

.rejilla-campo .eco { color: var(--no); }
.dib .cara-ref line { stroke: transparent; stroke-width: 8; }

.dib .cara-ref.foco line { stroke: var(--acento); stroke-width: 3; }

/* ---------- una pantalla: piezas de la aplicación que la maqueta no tiene ---------- */
@media (min-width: 1100px) and (min-height: 600px) {
  .resultados > .avisos { grid-column: 2 / -1; grid-row: 2; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .resultados > .tarjeta.unica { grid-column: 2 / -1; grid-row: 3; overflow: auto; }
  .cuerpo > .tarjeta:first-child { overflow: hidden; }
  :root[data-datos="plegado"] .datos { display: none; }
  :root[data-datos="plegado"] .trabajo { grid-template-columns: 0 minmax(0, 1.25fr) minmax(320px, 1fr); padding-left: 4px; }
  .pie { display: none; }
}
@media (min-width: 1100px) and (min-height: 600px) {
  /* Sin veredicto ni avisos, las tarjetas suben hasta arriba */
  .resultados:not(:has(> .veredicto)):has(> .avisos:empty) > .cuerpo > .tarjeta,
  .resultados:not(:has(> .veredicto)):has(> .avisos:empty) > .tarjeta.unica { grid-row: 1 / -1; }
  .datos .cab p { display: none; }
}
@media (min-width: 1100px) and (min-height: 600px) {
  /* La rejilla del contorno ocupa el alto que deje libre el panel de datos y se desplaza ella sola */
  .datos .grupo:has(#g-cont) { flex: 1 1 0; min-height: 150px; }

}
@media (min-width: 1100px) and (min-height: 600px) {
  /* En las tarjetas con scroll propio nada se encoge: si no cabe, se desplaza la tarjeta */
  .tarjeta > :not(.lienzo) { flex-shrink: 0; }
}
@media (min-width: 1100px) and (min-height: 600px) {
  /* El dibujo se justifica arriba en su panel y la leyenda va encima, como en datos y resultados */
  .lienzo { order: 2; }

}
@media (min-width: 1100px) and (min-height: 600px) {
  .lienzo ~ .cifras { order: 3; }
}

/* Gráfica común (guía § 9): se dibuja al tamaño real, los textos miden 12 px */

.graf .serie.s4 { stroke-dasharray: 12 4 2 4; }
.graf .serie.s5, .graf .punto.s5 { stroke: var(--serie-5); }
.graf .serie.s5 { stroke-dasharray: 5 3; }
.graf .serie.ref { stroke: var(--tinta-3); stroke-width: 1; stroke-dasharray: 5 4; stroke-linecap: butt; }

.graf .punto.ref { stroke: var(--tinta-3); }

.graf .serie.ref.s2 { stroke: var(--serie-v); }
.graf .serie.ref.s3 { stroke: var(--serie-giro); }

.graf-tabla thead tr + tr th { top: 22px; }

.graf .cruz { stroke: var(--tinta-3); stroke-width: 1; stroke-dasharray: 2 3; }
.graf .zoom { fill: var(--acento-suave); fill-opacity: .5; stroke: var(--acento); stroke-width: 1; }
.graf-barra { display: flex; gap: 4px; justify-content: flex-end; flex-shrink: 0; margin-bottom: 4px; }
.graf-barra .tecla { min-height: 22px; padding: 1px 8px; }
.graf-tip { position: absolute; pointer-events: none; background: var(--hoja); border: 1px solid var(--linea-fuerte); border-radius: var(--r-campo); box-shadow: var(--sombra); padding: 4px 8px; font-size: var(--t-s); display: flex; flex-direction: column; gap: 1px; white-space: nowrap; color: var(--tinta-2); }
.graf-tip b { color: var(--tinta); font-weight: 600; }
.graf-tip i { display: inline-block; width: 10px; height: 2px; margin: 0 6px 3px 0; vertical-align: middle; }
.graf-tip i.s1 { background: var(--acento); }
.graf-tip i.ref { background: var(--tinta-3); }
@media (min-width: 1100px) and (min-height: 600px) {
  .lienzo:has(> .grafica) { display: flex; flex-direction: column; }
  .lienzo > .grafica { flex: 1; height: auto; min-height: 0; }
}
.graf .ind { font-size: calc(9px + var(--mas)); }
.eco-arm { margin: 0; font-size: var(--t-xs); color: var(--tinta-3); text-align: right; }
/* Submenú del menú principal (Secciones: crear y editar · durabilidad) */
.menu .con-desp .flecha { margin-left: 4px; font-size: calc(10px + var(--mas)); opacity: .7; }
.menu-desp { position: fixed; inset: auto; margin: 0; padding: 4px; border: 1px solid var(--linea); border-radius: var(--r-campo); background: var(--hoja); box-shadow: var(--sombra); min-width: 160px; }
.menu-desp:popover-open { display: flex; flex-direction: column; gap: 2px; }
.menu-desp button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: var(--r-chip); cursor: pointer; color: var(--tinta-2); font-size: var(--t-s); }
.menu-desp button:hover { background: var(--hundido); color: var(--tinta); }
.menu-desp hr { border: 0; border-top: 1px solid var(--linea); margin: 3px 4px; }
.menu-desp button:disabled, .menu button:disabled { opacity: .45; cursor: default; background: none; color: var(--tinta-3); }
.menu-desp button[aria-current="page"] { color: var(--acento); background: var(--acento-suave); font-weight: 600; }
/* Tablas de la norma en Durabilidad: la fila que aplica, sombreada; el valor que manda, en negrita */
.tabla-dur tr.activa td, .tabla-dur tr.activa th { background: var(--acento-suave); }
.tabla-dur .manda { color: var(--acento); }
.tabla-dur td:first-child { text-align: left; }
span.mal { color: var(--no); font-weight: 600; }
span.bien { color: var(--ok); font-weight: 600; }
.medidor .art { font-size: var(--t-xs); color: var(--acento); }

/* ---------- Guía § 14: una forma por nivel ---------- */
/* 1 · Módulo: el activo, en píldora azul */
.menu button { border-radius: 999px; }
.menu button:hover { background: none; }
/* 2 y 3 · Cabeza común encima de las columnas: qué sección y qué vista */
.cabeza-modulo { background: var(--hoja); border-bottom: 1px solid var(--linea); padding: 0 var(--e4); display: flex; flex-wrap: wrap; align-items: stretch; gap: 0 var(--e5, 24px); }
.cabeza-modulo[hidden] { display: none; }
.cabeza-modulo .pestanas { border-bottom: 0; align-self: flex-end; }
.cabeza-modulo .pestanas button { min-height: 44px; }
.cabeza-modulo .selsec { padding-block: 8px; }
.selsec { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.desp { position: relative; }
.desp > button { display: inline-flex; align-items: center; gap: 6px; height: calc(28px + var(--mas)); padding: 0 8px; border: 1px solid var(--linea); border-radius: var(--r-campo); background: var(--hoja); color: var(--tinta-2); cursor: pointer; white-space: nowrap; font-size: var(--t-s); }
.desp > button:hover { border-color: var(--linea-fuerte); color: var(--tinta); }
.desp > button .cnt, .desp > button .car { color: var(--tinta-3); font-size: var(--t-xs); }
.desp.activo > button { border-color: var(--acento); color: var(--acento); background: var(--acento-suave); }
.desp.activo > button .cnt, .desp.activo > button .car { color: var(--acento); }
.desp .sep { margin: 0 4px; opacity: .6; }
.desp b { font-weight: 600; }
.ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.menu-sec { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 200px; padding: 4px; border: 1px solid var(--linea-fuerte); border-radius: var(--r-campo); background: var(--hoja); box-shadow: 0 6px 20px oklch(30% 0.02 250 / .14); display: grid; gap: 1px; }
.menu-sec .filas { display: grid; gap: 1px; max-height: calc(10 * 27px); overflow-y: auto; overscroll-behavior: contain; }
.menu-sec .buscar { height: var(--alto-campo); margin: 2px 2px 4px; padding: 0 6px; border: 1px solid var(--linea); border-radius: var(--r-chip); background: var(--hundido); font: inherit; color: inherit; }
.menu-sec .vacio { padding: 5px 8px; color: var(--tinta-3); }
.menu-sec button { display: flex; align-items: center; gap: 8px; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: var(--r-chip); cursor: pointer; white-space: nowrap; color: var(--tinta); font-size: var(--t-s); }
.menu-sec button:hover { background: var(--suelo); }
.menu-sec button[aria-current] { color: var(--acento); font-weight: 600; }
.menu-sec .alta { color: var(--acento); border-top: 1px solid var(--linea); border-radius: 0; margin-top: 3px; padding-top: 7px; }
.menu-sec .nombre-sec { margin-left: auto; padding-left: 12px; color: var(--tinta-3); font-weight: 400; }
.mas { height: calc(28px + var(--mas)); padding: 0 10px; border: 1px dashed var(--linea-fuerte); border-radius: var(--r-campo); background: none; color: var(--tinta-2); cursor: pointer; white-space: nowrap; font-size: var(--t-s); }
.mas:hover { color: var(--acento); border-color: var(--acento); }
/* 5 · Opción excluyente: contorno, sin gris; la elegida en azul y subrayada */
.seg { padding: 0; gap: 0; background: none; border: 1px solid var(--linea-fuerte); border-radius: var(--r-campo); overflow: hidden; }
.seg button { border-radius: 0; min-height: calc(24px + var(--mas)); }
.seg button + button { border-left: 1px solid var(--linea-fuerte); }
.seg button[aria-checked="true"] { background: none; box-shadow: inset 0 -2px 0 var(--acento); color: var(--acento); font-weight: 600; }
/* 6 · Ajuste de todo el proyecto: chip con su nombre delante */
.chip-ajuste { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; min-height: 26px; border-radius: var(--r-chip); border: 1px solid var(--linea); background: none; color: var(--tinta-2); cursor: pointer; white-space: nowrap; font-size: var(--t-s); }
.chip-ajuste b { color: var(--tinta); font-weight: 600; }
.no-vigente { color: var(--no); font-weight: 600; }
.barra .no-vigente { color: oklch(78% 0.14 27); }
#menu-norma small { margin-left: 8px; opacity: .75; font-size: var(--t-s); }
.chip-ajuste .flecha { font-size: calc(10px + var(--mas)); opacity: .7; }
.menu-desp button[aria-checked="true"] { color: var(--acento); font-weight: 600; }
/* Campos alineados: en densidad compacta todas las cajas miden 130 px y forman una columna a la derecha */
:root:not([data-densidad="comoda"]) .campo:not(.columna) > label { flex: 1 1 auto; max-width: calc(100% - 138px); }
:root:not([data-densidad="comoda"]) .campo:not(.columna) .caja { flex: 0 0 150px; width: 150px; margin-left: auto; }
:root:not([data-densidad="comoda"]) .par { grid-template-columns: minmax(0, 1fr); }
:root:not([data-densidad="comoda"]) .fila-arm { grid-template-columns: minmax(0, 1fr); gap: var(--hueco-campos); }
@media (max-width: 1099px), (max-height: 599px) {
  :root:not([data-densidad="comoda"]) .campo:not(.columna) .caja { flex-basis: 150px; width: 150px; }
  :root:not([data-densidad="comoda"]) .campo:not(.columna) > label { max-width: calc(100% - 158px); }
}
.datos > .grupo:first-child { border-top: 0; padding-top: 0; }
/* 8 · Tarjetón de la sección activa, encabezando la columna de datos */
.tarjeton { flex: none; padding: 5px 12px 6px; border: 1px solid var(--linea-fuerte); border-radius: var(--r-panel); background: var(--hoja); color: var(--tinta-3); }
.tarjeton .t-tipo { display: flex; align-items: center; gap: 6px; font-size: calc(10px + var(--mas)); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.tarjeton .t-tipo .ico { width: 14px; height: 14px; }
.tarjeton .t-nom { font-size: 26px; font-weight: 700; line-height: 1.1; color: var(--tinta); overflow-wrap: anywhere; }
.tarjeton .t-res { font-size: calc(11px + var(--mas)); color: var(--tinta-2); }
/* Compacto: el eco del armado (2ø12 = 226 mm²) ya está en la tabla de Armadura; solo se ve si hay error */
:root:not([data-densidad="comoda"]) .datos .campo:not(.mal) .eco { display: none; }
:root:not([data-densidad="comoda"]) .datos .grupo { padding-top: var(--e2); }
.datos .tarjeton + .grupo { border-top: 0; padding-top: 0; }
:root:not([data-densidad="comoda"]) .pie-sec { padding-top: var(--e2); margin-top: 0; }
/* Nota breve dentro de la caja, a la derecha, como las unidades (226 mm²) */
.caja .nota { font-variant-numeric: tabular-nums; }
.caja .nota:empty { display: none; }
.caja select + .nota { padding-left: 4px; }
.graf-barra .tecla:disabled { opacity: .45; cursor: default; }

/* ---------- Cabecera con la marca Ines: banda azul marino, como el repositorio de pilas ---------- */
:root { --banda: #10283b; --banda-tinta: #ffffff; --banda-tinta-2: #b9cfe0; --banda-linea: rgb(255 255 255 / .22); --marca-azul: #2b91cf; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --banda: #0c1e2c; } }
:root[data-theme="dark"] { --banda: #0c1e2c; }
.barra { background: var(--banda); border-bottom-color: var(--banda); color: var(--banda-tinta); }
.marca .logo { height: 30px; width: auto; flex: none; display: block; }
.marca .app { color: var(--banda-tinta-2); }
.marca .proy { color: var(--banda-tinta); }
.barra .menu button { color: var(--banda-tinta-2); }
.barra .menu button:hover { background: rgb(255 255 255 / .08); color: var(--banda-tinta); }
.barra .menu button[aria-current="page"] { background: var(--marca-azul); color: #fff; }
.barra .chip-ajuste, .barra .tecla { background: none; border-color: var(--banda-linea); color: var(--banda-tinta-2); }
.barra .chip-ajuste b { color: var(--banda-tinta); }
.barra .chip-ajuste:hover, .barra .tecla:hover { border-color: rgb(255 255 255 / .5); color: var(--banda-tinta); }
.barra kbd { background: none; border-color: var(--banda-linea); color: var(--banda-tinta-2); }
@media (max-width: 1099px), (max-height: 599px) { .marca .logo { height: 26px; } }
/* Menú principal a 16 px (guía § 3 y § 14.1): primer nivel, peso normal; el activo en seminegrita en su píldora */
.barra .menu button { font-size: calc(16px + var(--mas)); font-weight: 400; padding: 3px 12px; min-height: 30px; line-height: 1.3; }
.barra .menu button[aria-current="page"] { font-weight: 600; }
.barra .menu .con-desp .flecha { font-size: calc(10px + var(--mas)); }
@media (max-width: 1099px), (max-height: 599px) { .barra .menu button { padding: 4px 10px; } }
/* Diagramas: cinco axiles, un color cada uno (s1 y s2 ya definidos) */
:root { --serie-5: oklch(42% 0.04 250); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --serie-5: oklch(78% 0.04 250); } }
:root[data-theme="dark"] { --serie-5: oklch(78% 0.04 250); }
.graf .serie.ref.s1, .graf .serie.ref.s2, .graf .serie.ref.s3, .graf .serie.ref.s4, .graf .serie.ref.s5 { stroke-opacity: .55; }
.graf-tabla th.s3 { color: var(--serie-giro); text-align: center; }
.graf-tabla th.s4 { color: var(--serie-flecha); text-align: center; }
.graf-tabla th.s5 { color: var(--serie-5); text-align: center; }
/* Muestras de serie con su trazo (en la lectura del cursor y en las leyendas de texto) */
.graf-tip i, .marca-serie { display: inline-block; width: 22px; height: 3px; margin: 0 6px 3px 0; vertical-align: middle; border-radius: 1px; }
.graf-tip i.s1, .marca-serie.s1 { background: var(--acento); height: 3px; }
.graf-tip i.s2, .marca-serie.s2 { background: repeating-linear-gradient(90deg, var(--serie-v) 0 9px, transparent 9px 14px); }
.graf-tip i.s3, .marca-serie.s3 { background: repeating-linear-gradient(90deg, var(--serie-giro) 0 2px, transparent 2px 6px); }
.graf-tip i.s4, .marca-serie.s4 { background: repeating-linear-gradient(90deg, var(--serie-flecha) 0 12px, transparent 12px 16px, var(--serie-flecha) 16px 18px, transparent 18px 22px); }
.graf-tip i.s5, .marca-serie.s5 { background: repeating-linear-gradient(90deg, var(--serie-5) 0 5px, transparent 5px 8px); }
.datos .campo .ver-axil { margin: 0 6px 0 0; accent-color: var(--acento); flex-shrink: 0; }
.leyenda-nota { font-weight: 400; color: var(--tinta-3); font-size: var(--t-xs); margin-left: 6px; }
.lienzo.mini { display: flex; justify-content: center; flex: 0 0 auto !important; overflow: hidden; margin-bottom: var(--e2); order: 0 !important; }
.lienzo.mini svg { min-width: 0 !important; width: auto; max-width: 100%; max-height: 250px; }
/* Carga de DXF en la genérica */
.zona-dxf { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 5px 8px; border: 1px dashed var(--linea-fuerte); border-radius: var(--r-campo); color: var(--tinta-2); font-size: var(--t-s); cursor: pointer; background: var(--hundido); }
.zona-dxf:hover, .zona-dxf:focus-visible, .zona-dxf.encima { border-color: var(--acento); background: var(--acento-suave); color: var(--tinta); outline: none; }
.zona-dxf b { font-weight: 600; }
.info-i { position: relative; flex: none; width: 16px; height: 16px; border: 1px solid var(--tinta-3); border-radius: 50%; font: italic 600 calc(11px + var(--mas))/14px Georgia, serif; text-align: center; color: var(--tinta-3); cursor: help; }
.info-i:hover, .info-i:focus-visible { color: var(--acento); border-color: var(--acento); outline: none; }
.info-i::after { content: attr(data-tip); position: absolute; z-index: 20; right: -8px; bottom: calc(100% + 8px); width: 230px; padding: 6px 9px; border: 1px solid var(--linea-fuerte); border-radius: var(--r-campo); background: var(--hoja); box-shadow: var(--sombra); color: var(--tinta); font: 400 var(--t-s)/1.4 var(--f); text-align: left; display: none; pointer-events: none; }
.info-i:hover::after, .info-i:focus-visible::after { display: block; }



.datos > * { flex-shrink: 0; }
.zona-dxf .zona-txt { min-width: 0; text-align: center; }
.zona-dxf .zona-txt.mal { color: var(--no); font-size: var(--t-xs); }
.zona-dxf .zona-txt.ok { font-size: var(--t-xs); }
/* Rejilla con filas numeradas y columna calculada */
table.rejilla.numerada tbody { counter-reset: fila; }
table.rejilla.numerada tbody tr:not(.nueva) { counter-increment: fila; }
table.rejilla.numerada tbody tr:not(.nueva) td:first-child { position: relative; padding-left: 26px; }
table.rejilla.numerada tbody tr:not(.nueva) td:first-child::before { content: counter(fila); position: absolute; left: 6px; top: 0; font-size: var(--t-xs); color: var(--tinta-3); line-height: calc(26px + var(--mas)); }
table.rejilla th.calc, table.rejilla td.calc { color: var(--tinta-3); cursor: default; background: var(--hundido); font-weight: 400; }
table.rejilla th.calc { font-weight: 600; }
.cara-ref ~ .num-cara, .num-cara { fill: var(--tinta-3); font: 600 calc(10px + var(--mas)) var(--f); pointer-events: none; }
table.rejilla.numerada th:nth-child(1) { width: 27%; }
table.rejilla.numerada th:nth-child(2) { width: 22%; }
table.rejilla.numerada th:nth-child(3) { width: 27%; }
table.rejilla.numerada th:nth-child(4) { width: 24%; }
table.rejilla.numerada tbody tr:not(.nueva) td:first-child { padding-left: 22px; }
.desliza-sec { width: 100%; margin: 0; accent-color: var(--acento); height: 18px; }
/* Datos de solo lectura (Diagramas): sin caja ni flecha, como texto */
.fijo .caja { background: transparent; border-color: transparent; box-shadow: none; }
.fijo input, .fijo select { appearance: none; -webkit-appearance: none; background: transparent; color: var(--tinta-2); opacity: 1; cursor: default; pointer-events: none; }
/* Con el menú completo, a anchos de portátil la cabecera se mantiene en una fila */
@media (min-width: 1100px) and (max-width: 1500px) { .barra .menu button { font-size: calc(14px + var(--mas)); padding: 3px 7px; } .barra .menu { gap: 0; } }

/* Materiales */
.edad .formula { font-size: var(--t-xs); color: var(--tinta-3); margin: 8px 0 0; line-height: 1.5; }
.edad table th, .edad table td { text-align: right; }
/* A anchos de portátil la norma y los comandos caben en la fila del menú: sin la palabra «Norma» ni las teclas */
@media (min-width: 1100px) and (max-width: 1500px) { #seg-norma .chip-ajuste > span:first-child { display: none; } #abrir-paleta kbd { display: none; } }
/* Propiedades de un material: etiqueta y valor juntos, no repartidos por todo el ancho del panel */
.tarjeta table.prop { width: 100%; }
.tarjeta table.prop td { padding-left: 20px; }
.edad tr.dia28 > * { background: var(--hundido); }
.sub-edad { margin: 10px 0 2px; font-size: var(--t-s); color: var(--tinta-2); font-weight: 600; }
.edad table th, .edad table td { padding-left: 4px; padding-right: 4px; }
.edad table.excel th, .edad table.excel td { border: 1px solid var(--linea); }

/* Durabilidad EHE-08: clases de exposición; en gris las que no caben con las marcadas */
.chip-clase { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 44px; }
.chip-clase .ce { font-size: calc(10px + var(--mas)); font-weight: 400; color: var(--tinta-3); }
.chip-clase[aria-pressed="true"] .ce { color: inherit; opacity: .8; }
.chip-clase:disabled { opacity: .35; cursor: not-allowed; background: var(--hundido); }
.cab-clases { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.boton.pequeno { padding: 0 8px; min-height: 24px; font-size: var(--t-s); }
.desc-clases { display: flex; flex-direction: column; gap: 2px; }
/* Aclaraciones plegadas de Durabilidad (guía § 14.9): fila con ▸; abierta, fila y explicación en una caja chocolate */
details.pleg { border: 1px solid transparent; border-radius: 6px; }
details.pleg > summary { list-style: none; position: relative; cursor: pointer; padding: 3px 8px 3px 18px; font-size: var(--t-s); color: var(--tinta-2); }
details.pleg > summary::-webkit-details-marker { display: none; }
details.pleg > summary::before { content: ''; position: absolute; left: 6px; top: calc(50% - 3px); width: 5px; height: 5px; border-right: 1.5px solid var(--tinta-3); border-bottom: 1.5px solid var(--tinta-3); transform: rotate(-45deg); transition: transform .15s; }
details.pleg[open] > summary::before { transform: rotate(45deg); }
details.pleg > summary:hover { background: var(--suelo); border-radius: 6px; }
details.pleg[open] { background: var(--nota); border-color: var(--nota-borde); }
details.pleg[open] > summary:hover { background: none; }
details.pleg > .cuenta { padding: 2px 10px 8px 18px; color: var(--tinta-2); font-size: var(--t-s); display: flex; flex-direction: column; gap: 4px; }
.grupos-esp { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 14px; justify-content: start; }
.grupos-esp h3 { margin-top: var(--e2); }
.desc-clases .nota { line-height: 1.35; }

/* Análisis · vigas de un vano: esquema y leyes a todo el ancho (tokens --serie-*, guía § 9: M azul, V verde oliva, giro verde azulado, flecha siena) */
.vigas-leyes { flex: 1; min-height: 0; overflow: hidden; display: block; }
svg.vl { display: block; width: 100%; height: 100%; }
.vl text { fill: var(--tinta-2); font: calc(12px + var(--mas)) var(--f); font-variant-numeric: tabular-nums; }
.vl .vl-tit { font-weight: 600; }
.vl .vl-tit.lectura { font-weight: 500; }
.vl .vl-M { --c: var(--serie-m); } .vl .vl-V { --c: var(--serie-v); } .vl .vl-giro { --c: var(--serie-giro); } .vl .vl-flecha { --c: var(--serie-flecha); }
.vl text.vl-M, .vl text.vl-V, .vl text.vl-giro, .vl text.vl-flecha { fill: var(--c); }
.vl .vl-curva { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; }
.vl .vl-area { stroke: none; }
.vl .vl-hatch { stroke: var(--c); stroke-width: 1; opacity: .55; }
.vl .vl-num { font-weight: 600; paint-order: stroke; stroke: var(--hoja); stroke-width: 3px; stroke-linejoin: round; }
.vl .vl-num.carga { fill: var(--tinta-2); }
.vl .vl-num.rea { fill: var(--tinta); }
.vl .vl-viga { stroke: var(--tinta); stroke-width: 5; fill: none; }
.vl .vl-viga.fina { stroke: var(--tinta-3); stroke-width: 3; }
.vl .vl-apoyo { fill: var(--hormigon); stroke: var(--hormigon-borde); }
.vl .vl-empot { stroke: var(--hormigon-borde); stroke-width: 2; fill: none; }
.vl .vl-empot.fino { stroke-width: 1; }
.vl .vl-carga { stroke: var(--tinta-2); stroke-width: 1.8; fill: none; }
.vl .vl-carga.puntual { stroke-width: 2.6; }
/* Las cargas van sin color (gris, trama de rayas verticales) para no parecerse a ningún diagrama de resultados */
.vl .vl-distr { fill: url(#vl-h-q); stroke: var(--tinta-3); stroke-width: 1; }
.vl .vl-hatch-q { stroke: var(--tinta-3); stroke-width: 1.2; }
.vl .vl-guia { stroke: var(--linea); stroke-width: 1; stroke-dasharray: 3 4; }

      const [b0, h2] = dir === "b" ? [s.geo.h, s.geo.b] : [s.geo.b, s.geo.h];
      return { ...comun, b0, h: h2, d: h2 - r, Ac, Asl: 0, Asc: A, circular: false, r };
    }
    if (s.forma === "circular") {
      const D = s.geo.D;
      const arm = s.armado.find((a) => a.tipo === "anillo");
      const r = arm?.r ?? 0.05;
      const d = D / 2 + (D / 2 - r) * Math.SQRT1_2;
      const b0 = 2 * Math.sqrt((d / 2) ** 2 - (d / 4) ** 2);
      return { ...comun, b0, h: D, d, Ac, Asl: 0, Asc: A, circular: true, r };
    }
    throw new ErrorClave("cor.errForma", s.nombre, s.forma);
  }

    "pun.f.per23": "b<sub>0,5</sub>: l\xEDnea envolvente a 0,5 d<sub>v</sub> de la cara, con los tramos rectos de 3 d<sub>v</sub> como m\xE1ximo \xB7 interior 2(c<sub>1</sub>+c<sub>2</sub>)+\u03C0 d<sub>v</sub> \xB7 borde c<sub>1</sub>+2c<sub>2</sub>+\u03C0 d<sub>v</sub>/2 \xB7 esquina c<sub>1</sub>+c<sub>2</sub>+\u03C0 d<sub>v</sub>/4 \xB7 b<sub>0</sub>: parte de la cara que ve b<sub>0,5</sub>",
    "pun.f.tauEHE": "\u03C4<sub>rd</sub> = 0,18/\u03B3<sub>c</sub>\xB7\u03BE\xB7(100 \u03C1<sub>l</sub> f<sub>cv</sub>)<sup>1/3</sup> + 0,1 \u03C3'<sub>cd</sub> \u2265 0,075/\u03B3<sub>c</sub>\xB7\u03BE<sup>3/2</sup>\xB7f<sub>cv</sub><sup>1/2</sup> + 0,1 \u03C3'<sub>cd</sub> \xB7 \u03BE = 1 + \u221A(200/d) \u2264 2 \xB7 \u03C1<sub>l</sub> = \u221A(\u03C1<sub>x</sub>\u03C1<sub>y</sub>) \u2264 0,02",
    "pun.f.vcEHE": "F<sub>sd,ef</sub> = \u03B2\xB7V<sub>Ed</sub> \u2264 \u03C4<sub>rd</sub>\xB7u<sub>1</sub>\xB7d",

    "pun.f.vcsEHE": "\u03C4<sub>sd</sub> \u2264 0,75 \u03C4<sub>rd</sub> + 1,5\xB7(d/s)\xB7A<sub>sw</sub>\xB7f<sub>y\u03B1,d</sub>\xB7sen \u03B1/(u<sub>1</sub>\xB7d), con \u03B1 = 90\xB0 (46.4.1)",
    "pun.f.extEHE": "F<sub>sd</sub> (\u03B2 = 1) \u2264 \u03C4<sub>rd</sub>\xB7u<sub>n,ef</sub>\xB7d, con u<sub>n,ef</sub> a 2d del \xFAltimo per\xEDmetro de cercos",
    "pun.f.aswEHE": "A<sub>sw</sub> = (\u03B2\xB7V<sub>Ed</sub> \u2212 0,75 \u03C4<sub>rd</sub> u<sub>1</sub> d)\xB7s/(1,5\xB7d\xB7f<sub>y\u03B1,d</sub>)",
    "pun.f.nperEHE": "El \xFAltimo per\xEDmetro de cercos llega hasta u<sub>n,ef</sub> = V<sub>Ed</sub>/(\u03C4<sub>rd</sub>\xB7d) menos 2d",
    "pun.f.vRdcEC": "v<sub>Rd,c</sub> = C<sub>Rd,c</sub>\xB7k\xB7(100 \u03C1<sub>l</sub> f<sub>ck</sub>)<sup>1/3</sup> + k<sub>1</sub> \u03C3<sub>cp</sub> \u2265 \u03BD<sub>m\xEDn</sub> + k<sub>1</sub> \u03C3<sub>cp</sub> \xB7 C<sub>Rd,c</sub> = 0,18/\u03B3<sub>c</sub> \xB7 k<sub>1</sub> = 0,1 \xB7 k = 1 + \u221A(200/d) \u2264 2 \xB7 \u03BD<sub>m\xEDn</sub> = 0,075/\u03B3<sub>c</sub>\xB7k<sup>3/2</sup>\xB7f<sub>ck</sub><sup>1/2</sup> (f<sub>ck</sub> \u2264 60)",
    "pun.f.vcEC": "v<sub>Ed</sub> = \u03B2\xB7V<sub>Ed</sub>/(u<sub>1</sub>\xB7d) \u2264 v<sub>Rd,c</sub>",
    "pun.f.vmaxEC": "v<sub>Ed</sub> = \u03B2\xB7V<sub>Ed</sub>/(u<sub>0</sub>\xB7d) \u2264 v<sub>Rd,m\xE1x</sub> = 0,5\xB7\u03BD\xB7f<sub>cd</sub>, \u03BD = 0,6 (1 \u2212 f<sub>ck</sub>/250)",
    "pun.f.vcsEC": "v<sub>Rd,cs</sub> = 0,75 v<sub>Rd,c</sub> + 1,5\xB7(d/s<sub>r</sub>)\xB7A<sub>sw</sub>\xB7f<sub>ywd,ef</sub>\xB7sen \u03B1/(u<sub>1</sub>\xB7d) \xB7 f<sub>ywd,ef</sub> = 250 + 0,25 d \u2264 f<sub>ywd</sub>",
    "pun.f.extEC": "u<sub>out,ef</sub> = \u03B2\xB7V<sub>Ed</sub>/(v<sub>Rd,c</sub>\xB7d); el \xFAltimo per\xEDmetro de cercos a no m\xE1s de k\xB7d = 2d dentro de u<sub>out,ef</sub>",
    "pun.f.minEC": "A<sub>sw,m\xEDn</sub>\xB7(1,5 sen \u03B1 + cos \u03B1)/(s<sub>r</sub>\xB7s<sub>t</sub>) \u2265 0,08 \u221Af<sub>ck</sub>/f<sub>yk</sub>, con A<sub>sw,m\xEDn</sub> = una rama y s<sub>t</sub> = u<sub>1</sub>/ramas",
    "pun.f.aswEC": "A<sub>sw</sub> = (\u03B2\xB7V<sub>Ed</sub> \u2212 0,75 v<sub>Rd,c</sub> u<sub>1</sub> d)\xB7s<sub>r</sub>/(1,5\xB7d\xB7f<sub>ywd,ef</sub>)",
    "pun.f.nperEC": "El \xFAltimo per\xEDmetro de cercos llega hasta u<sub>out,ef</sub> menos k\xB7d",
    "pun.f.kpb": "k<sub>pb</sub> = 3,6\xB7(1 \u2212 b<sub>0</sub>/b<sub>0,5</sub>), entre 1 y 2,5",
    "pun.f.tau23": "\u03C4<sub>Rd,c</sub> = 0,6/\u03B3<sub>V</sub>\xB7k<sub>pb</sub>\xB7(100 \u03C1<sub>l</sub> f<sub>ck</sub> d<sub>dg</sub>/d<sub>v</sub>)<sup>1/3</sup> \u2264 0,5/\u03B3<sub>V</sub>\xB7\u221Af<sub>ck</sub> \xB7 \u03C1<sub>l</sub> = \u221A(\u03C1<sub>x</sub>\u03C1<sub>y</sub>)",
    "pun.f.vRdc23": "V<sub>Rd,c</sub> = \u03C4<sub>Rd,c</sub>\xB7b<sub>0,5</sub>\xB7d<sub>v</sub> \u2265 V<sub>Ed,ef</sub> = \u03B2<sub>e</sub>\xB7V<sub>Ed</sub>",
    "pun.f.vmax23": "V<sub>Rd,m\xE1x</sub> = \u03B7<sub>sys</sub>\xB7V<sub>Rd,c</sub> \xB7 \u03B7<sub>sys</sub> = 0,50 + 0,63\xB7(b<sub>0</sub>/d<sub>v</sub>)<sup>1/4</sup> \u2265 1 (cercos)",
    "pun.f.etas": "\u03B7<sub>c</sub> = V<sub>Rd,c</sub>/V<sub>Ed,ef</sub> \xB7 \u03B7<sub>s</sub> = d<sub>v</sub>/(150 \u03C6<sub>w</sub>) + \u221A(15 d<sub>dg</sub>/d<sub>v</sub>)\xB7(1/(\u03B7<sub>c</sub> k<sub>pb</sub>))<sup>3/2</sup> \u2264 0,8",
    "pun.f.etasDim": "\u03B7<sub>c</sub> = V<sub>Rd,c</sub>/V<sub>Ed,ef</sub>; \u03B7<sub>s</sub> depende del di\xE1metro del cerco (\u03C6<sub>w</sub>)",
    "pun.f.vcs23": "V<sub>Rd,cs</sub> = \u03B7<sub>c</sub>\xB7V<sub>Rd,c</sub> + \u03B7<sub>s</sub>\xB7V<sub>w</sub> \u2265 V<sub>w</sub> \xB7 V<sub>w</sub> = \u03C1<sub>w</sub>\xB7f<sub>ywd</sub>\xB7b<sub>0,5</sub>\xB7d<sub>v</sub> = A<sub>sw,per</sub>\xB7f<sub>ywd</sub>\xB7d<sub>v</sub>/s<sub>r</sub> \xB7 s<sub>r</sub> = m\xE1x(a<sub>1</sub> + s<sub>1</sub>/2; s<sub>1</sub>)",
    "pun.f.ext23": "b<sub>0,5,out</sub> = b<sub>0,5</sub>\xB7(d<sub>v</sub>/d<sub>v,out</sub>/\u03B7<sub>c</sub>)\xB2 \xB7 d<sub>v,out</sub> = d<sub>v</sub> \u2212 c<sub>v</sub> (c<sub>v</sub> = \u03C6<sub>w</sub>) \xB7 el \xFAltimo per\xEDmetro de cercos a no m\xE1s de 0,5\xB7d<sub>v,out</sub> dentro",
    "pun.f.nper23": "El \xFAltimo per\xEDmetro de cercos llega hasta b<sub>0,5,out</sub> menos 0,5\xB7d<sub>v,out</sub>; al menos 2 per\xEDmetros",
    "pun.f.disp": "a<sub>1</sub> \u2264 d/2 \xB7 s<sub>r</sub> \u2264 0,75 d \xB7 s<sub>t</sub> \u2264 1,5 d (en el primer per\xEDmetro de la 2023, 0,75 d<sub>v</sub>) \xB7 al menos 2 per\xEDmetros en EC-2",

    "pun.n.alcance": "Qu\xE9 incluye y qu\xE9 no",
    "pun.n.perim": "Per\xEDmetros de control",
    "pun.n.beta": "Coeficiente \u03B2",
    "pun.n.circ": "Pilares circulares de borde y esquina",
    "pun.n.norma": "Esta norma frente a las otras",
    "pun.alcance": "Losa maciza de canto constante; pilar rectangular o circular, interior, de borde o de esquina (a ras del borde libre); cercos verticales. No incluye todav\xEDa: barras levantadas, huecos, momento transferido calculado (\u03B2 se da o se toma tabulado), pretensado, zapatas, capiteles ni extremos y esquinas de muro.",
    "pun.alcance23": "Losa maciza de canto constante; pilar rectangular o circular, interior, de borde o de esquina (a ras del borde libre); cercos verticales. No incluye todav\xEDa: barras levantadas, huecos, momento transferido calculado (\u03B2<sub>e</sub> se da o se toma tabulado), pretensado y axiles (k<sub>pp</sub>), a<sub>p</sub> (8.97), zapatas, capiteles ni extremos y esquinas de muro.",
    "pun.perim": "El per\xEDmetro cr\xEDtico u<sub>1</sub> va a 2d de la cara del pilar y es el geom\xE9trico m\xEDnimo (l\xEDnea envolvente cortada por el borde libre). u<sub>0</sub>, el de la comprobaci\xF3n de la compresi\xF3n junto al pilar, es el de la cara; en borde y esquina se limita a 1,5 d por lado en la EHE-08 y a 3 d en el EC-2.",
    "pun.perim23": "El per\xEDmetro de control b<sub>0,5</sub> va a 0,5\xB7d<sub>v</sub> de la cara, con tramos rectos de 3\xB7d<sub>v</sub> como m\xE1ximo (8.4.2(3)). b<sub>0</sub> es la parte de la cara que ve b<sub>0,5</sub>; con \xE9l se calcula k<sub>pb</sub> y el m\xE1ximo \u03B7<sub>sys</sub>.",
    "pun.beta": "\u03B2 = 1,00 sin momento transferido; con momento, el valor simplificado es 1,15 en pilares interiores, 1,40 en los de borde y 1,50 en los de esquina (EHE-08 46.3; EC-2 fig. 6.21N). \xABOtro \u03B2\xBB permite escribir el que resulte de un c\xE1lculo propio.",
    "pun.beta23": "\u03B2<sub>e</sub> aproximado: 1,15 interior, 1,4 borde y 1,5 esquina (tabla 8.3), v\xE1lido solo si la estabilidad no depende del p\xF3rtico losa-pilar, los vanos contiguos no difieren m\xE1s del 25 %, la carga es uniforme y el momento en borde y esquina no pasa de 0,25\xB7b<sub>e</sub>\xB7d\xB2\xB7f<sub>cd</sub>. Sin momento: 1,05 en interior (m\xEDnimo del m\xE9todo refinado) y 1,00 en borde y esquina.",
    "pun.circNota": "El pilar circular de borde y esquina es tangente al borde (o a los dos bordes) y el per\xEDmetro es el arco de la circunferencia a 2d (0,5 d<sub>v</sub> en la 2023) cortado por el borde: el geom\xE9trico m\xEDnimo. El Prontuario 3.1 usaba D + \u03C0(D/2 + 2d) en el borde y D + \xBD\u03C0(D/2 + 2d) en la esquina, que lo aproximan (diferencia menor del 1 %).",
    "pun.notaEHE": "El Prontuario 3.1 tomaba el hormig\xF3n completo con cercos y no ten\xEDa m\xEDnimo de \u03C4<sub>rd</sub>; la EHE-08 toma 0,75 \u03C4<sub>rd</sub> con cercos y el m\xEDnimo manda con poca cuant\xEDa. Los cercos se limitan a f<sub>y\u03B1,d</sub> \u2264 400 MPa. Las figuras 46.5 (u<sub>n,ef</sub> y disposiciones) no se extraen del PDF: u<sub>n,ef</sub> se toma a 2d del \xFAltimo per\xEDmetro de cercos y las disposiciones siguen el criterio del EC-2. Pendiente de contrastar con el BOE: el m\xEDnimo de \u03C4<sub>rd</sub>, el 0,75 y el 1,5 de 46.4.1.",
    "pun.notaEC": "Con estos coeficientes (Anejo Nacional) el EC-2 2004 da lo mismo que la EHE-08 sin armadura. Con cercos usa f<sub>ywd,ef</sub> = 250 + 0,25 d y pide al menos dos per\xEDmetros, armadura m\xEDnima (9.11) y que el \xFAltimo per\xEDmetro quede a no m\xE1s de k\xB7d = 2d de u<sub>out,ef</sub> (AN).",
    "pun.nota23": "El EC-2 2023 pasa el per\xEDmetro de 2d a 0,5 d<sub>v</sub> y lo compensa con un \u03C4 mayor (k<sub>pb</sub>): con el mismo caso la carga sin armadura puede salir bastante menor (un 40 % en el ejemplo de la gu\xEDa). Con cercos el hormig\xF3n aporta \u03B7<sub>c</sub>\xB7V<sub>Rd,c</sub>, que baja al subir la carga, y \u03B7<sub>s</sub> \u2264 0,8 depende del di\xE1metro del cerco; por eso la carga \xFAltima se obtiene por iteraci\xF3n. Valores CEN, sin Anejo Nacional (\u03B3<sub>V</sub> = 1,4). Aqu\xED d<sub>v,out</sub> = d<sub>v</sub> \u2212 \u03C6<sub>w</sub> (la figura 8.23 no se extrae del PDF).",

    "pun.notaEC": "With these coefficients (National Annex) EC-2 2004 gives the same as EHE-08 without reinforcement. With links it uses f<sub>ywd,ef</sub> = 250 + 0.25 d and requires at least two perimeters, minimum reinforcement (9.11) and the last perimeter within k\xB7d = 2d of u<sub>out,ef</sub> (NA).",
